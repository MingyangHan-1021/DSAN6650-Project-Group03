# Medium difficulty (main experiment config)
# Every parameter is listed here; anything missing falls back to KitchenConfig in core.py.

episode_length: 300                     # steps per episode

# ---- Data files ----
recipes_file: data/recipes.json         # recipes
layout_file: data/layouts/open.json     # kitchen layout (open / split)
menu: [salad, tomato_soup, burger, pasta]  # dishes for this episode (keys in recipes.json)

# ---- The two agents ----
# skills: steps each job takes; null means the agent cannot do it
agents:
  - name: chef
    move_speed: 2.0                     # grid cells per step
    skills: {chop: 3, fry: 2, wash: 3}
  - name: assistant
    move_speed: 2.0
    skills: {chop: 2, fry: 4, wash: 2}

# ---- Plates ----
n_plates: 6
initial_dirty_plates: 0
dirty_return_delay: 5                   # steps after serving until the plate reaches the sink

# ---- Cookers ----
burn_after: 8                           # steps a finished cooker can wait before burning
cooker_clean_time: 2                    # steps to clean a burnt cooker

# ---- Orders ----
orders:
  orders_file: null                     # order CSV; null = generate from the seed
  arrival_rate: 0.03                    # only used when arrival_schedule is null
  arrival_schedule:                     # [step, rate (orders/step)], linear in between
    - [0, 0.02]
    - [80, 0.03]
    - [120, 0.07]                       # rush hour: steps 120-200
    - [200, 0.07]
    - [240, 0.03]
    - [300, 0.02]
  dishes_per_order_probs: [0.7, 0.3]    # probability of 1 / 2 dishes per order
  dish_weights: null                    # {dish: weight}; null = uniform
  patience_min: 100                     # steps from arrival until the order expires
  patience_max: 140
max_visible_orders: 5                   # orders shown in the observation

# ---- Tips ----
tip_max_rate: 0.20
tip_grace_wait: 30                      # full tip if the order takes <= 30 steps
tip_zero_wait: 100                      # no tip at >= 100 steps

# ---- Reward ----
reward:
  revenue_scale: 0.1                    # (price + tip) x 0.1
  expire_penalty: 1.0                   # per expired order
  burn_penalty: 0.5                     # per burnt cooker
  waste_penalty: 0.1                    # per food item thrown away
  invalid_action_penalty: 0.0
  failed_action_penalty: 0.0
  step_penalty: 0.0
  shaping:
    enabled: true
    chop: 0.05
    fry: 0.05
    cooker_start: 0.1
    cooker_collect: 0.1
    plate_add: 0.05
    dish_delivered: 0.3
