# Hard: 5 dishes, split kitchen (handoffs must go through counters), stronger rush, few plates
# Only parameters that differ from the defaults are listed (see KitchenConfig in core.py)
menu: [salad, tomato_soup, burger, pasta, pizza]
layout_file: data/layouts/split.json
n_plates: 5
initial_dirty_plates: 2
orders:
  arrival_schedule:
    - [0, 0.02]
    - [60, 0.04]
    - [100, 0.09]
    - [200, 0.09]
    - [240, 0.04]
    - [300, 0.02]
  dishes_per_order_probs: [0.5, 0.35, 0.15]
  patience_min: 90
  patience_max: 120
